[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-quant"
version = "3.0.0"
description = "A quant-style platform for a student's job search: postings priced by effective wage and combined like a portfolio, applications analysed with Bayesian rates and Monte Carlo."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marcelo Farez" }]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jsq = "job_search_quant.cli:main"

[tool.setuptools]
packages = ["job_search_quant"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
