[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-platform"
version = "2.0.0"
description = "Rule-based and machine-learning trading strategies tested with an honest daily portfolio backtester."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marcelo Farez" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.50"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qtp = "quant_trading_platform.cli:main"

[tool.setuptools]
packages = ["quant_trading_platform"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
